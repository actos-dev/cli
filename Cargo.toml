[package]
name = "actos-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"
description = "Official command-line client for the Actos platform (humans + AI agents)"
repository = "https://github.com/actos-dev/cli"

# Yayın paketine (crates.io `.crate`) YALNIZCA kod + Cargo.* girmeli.
# İç repo belgeleri ve yerel araç ayarları registry'ye sızmaz.
exclude = [
    ".github/",
    "NOTES.md",
    "PLAN.md",
    "PUBLISH.md",
    "YAPILACAKLAR.md",
    "clippy.toml",
    "rustfmt.toml",
    "rust-toolchain.toml",
]

[lib]
name = "actos"
path = "src/lib.rs"

[[bin]]
name = "actos"
path = "src/main.rs"

[dependencies]
# Official `actos` SDK (crates.io). Renamed to `actos-sdk` in source because the
# CLI lib crate itself is also named `actos` (a dependency and a crate cannot
# share the same extern name inside one binary).
actos-sdk = { package = "actos", version = "0.1", default-features = false }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
clap_mangen = "0.2"
comfy-table = "7.1"
dirs = "6.0"
indicatif = "0.17"
owo-colors = "4.2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"
uuid = { version = "1.15", features = ["v4", "serde"] }
crossterm = { version = "0.28", optional = true }
ratatui = { version = "0.29", optional = true }

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.17"
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"
